<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script> <!-- defer faz com que o script seja carregado depois do html-->
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">



    <title>Bora Codar — Sorteador de desafios</title>

</head>

<body>

    <main>
        <header>
            <h1>Bora Codar</h1>
            <p>Seu próximo projeto começa com um sorteio. Boa sorte!</p>
        </header>

        <!-- A dificuldade escolhida sera usada pelo JS -->
        <div>
            <label for="dificuldade">Escolha a dificuldade</label>

            <select id="dificuldade">
                <option value="moleza">Moleza — HTML e CSS</option>
                <option value="desafio">Desafio — com JavaScript</option>
            </select>

            <!-- Quando marcada, esta opção exclui os desafios concluídos do sorteio. -->
            <label id="opcao-pendentes">
                <input type="checkbox" id="somente-pendentes">
                Sortear apenas desafios pendentes
            </label>

            <button type="button" id="botao-sortear">
                Sortear desafio
            </button>

            <!-- Exibe avisos do sorteio sem abrir o modal. -->
            <p id="aviso-sorteio" role="status" hidden></p>

            <!-- Anuncia a atualização do progresso também para leitores de tela. -->
            <p id="progresso" aria-live="polite">
                0 desafios concluídos
            </p>

            <!-- Permite abrir e recolher a lista sem precisar de outro evento. -->
            <details id="painel-concluidos">
                <summary>Ver desafios concluídos</summary>

                <!-- O JavaScript vai preencher esta lista. -->
                <ul id="lista-concluidos"></ul>

                <!-- Aparece somente enquanto a lista estiver vazia. -->
                <p id="mensagem-sem-concluidos">
                    Seus desafios concluídos vão aparecer aqui.
                </p>

                <!-- Permite apagar as conclusões e começar novamente. -->
                <button type="button" id="reiniciar-progresso">
                    Reiniciar progresso
                </button>

            </details>

        </div>

        <!-- Esse conteudo sera substituido quando acontecer o sorteio -->
        <dialog id="resultado" aria-labelledby="nome-desafio">
            <button type="button" id="fechar-resultado" aria-label="Fechar resultado">
                &times;
            </button>

            <img id="imagem-desafio" alt="" hidden>

            <h2 id="nome-desafio">Seu desafio</h2>

            <p id="descricao-desafio"></p>
            <h3 id="titulo-requisitos" hidden>O que construir</h3>

            <ul id="requisitos-desafio"></ul>

            <button type="button" id="concluir-desafio">
                Marcar como concluído
            </button>

        </dialog>
    </main>

</body>

</html>
